# ---------------------------------------------------------------
# Infimit CI — backend + frontend + ai-service
#
# Three parallel jobs share the same workflow:
#   - `backend`    → typecheck / lint / format / test / build
#   - `frontend`   → typecheck / lint / format / test / build
#   - `ai-service` → pytest (FastAPI unit tests; the Groq call is mocked)
#
# All run on every PR and every push to main. The Node jobs use a
# lockfile-keyed npm cache; the ai-service job caches pip. Concurrency
# cancellation prevents wasted minutes on rapid-fire pushes.
# ---------------------------------------------------------------

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel any superseded run for the same PR or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend ─────────────────────────────────────────────────────────
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongo-mms-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-mongo-mms-

      # Real PEMs are gitignored; tests need them to sign RS256 tokens.
      # Production environments inject keys via a secrets manager — this
      # step only mints throwaway dev keypairs for the CI run.
      - name: Generate JWT dev keypairs
        run: npx tsx scripts/generate-keys.ts

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Final guard against the path-alias regression: every file in dist/
      # should have its imports rewritten by tsc-alias. If a stray '@/...'
      # makes it into the bundle, the production runtime will fail.
      - name: Verify no unresolved path aliases in build output
        run: |
          if grep -RE "require\(['\"]@/" dist/; then
            echo "Found unresolved '@/' alias in compiled output — tsc-alias did not run."
            exit 1
          fi
          echo "OK — no unresolved aliases."

  # ─── Frontend ────────────────────────────────────────────────────────
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Confirm the production bundle is producible and dist/ has emitted assets.
      # Vite emits content-hashed JS/CSS — if dist/ is empty or has no index.html,
      # the build silently failed.
      - name: Verify dist artifacts emitted
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "OK — dist/index.html and dist/assets present."

  # ─── AI service ──────────────────────────────────────────────────────
  ai-service:
    name: AI service checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ai-service

    # These vars only need to be PRESENT so `app.config.Settings()` constructs
    # at import (every test imports the FastAPI app). The unit tests mock the
    # Groq call, so GROQ_API_KEY is a dummy and is never used. AI_INTERNAL_KEY
    # must equal the tests' VALID_KEY ("test_key").
    env:
      AI_INTERNAL_KEY: test_key
      PORT: '8000'
      LOG_LEVEL: info
      MODELS_CACHE_DIR: ./models_cache
      ENABLE_METRICS: 'true'
      GROQ_API_KEY: dummy-key-not-used-in-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        # pytest is a dev-only dep, so it isn't in the runtime requirements.txt.
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Test
        # `tests/test_api.py::test_summarize_success` is deselected: it makes a
        # REAL Groq API call (unmocked), which CI can't run without a live key.
        # The mocked `test_summarize_stub_success` covers the same contract.
        run: pytest -q --deselect tests/test_api.py::test_summarize_success
