# ---------------------------------------------------------------
# Infimit CI — backend + frontend
#
# Two parallel jobs share the same workflow:
#   - `backend`  → typecheck / lint / format / test / build
#   - `frontend` → typecheck / lint / format / test / build
#
# Each job uses its own lockfile-keyed npm cache and only runs when its
# files change (or when the workflow file itself changes). Concurrency
# cancellation prevents wasted minutes on rapid-fire pushes.
# ---------------------------------------------------------------

name: CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'

# Cancel any superseded run for the same PR or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend ─────────────────────────────────────────────────────────
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongo-mms-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-mongo-mms-

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Final guard against the path-alias regression: every file in dist/
      # should have its imports rewritten by tsc-alias. If a stray '@/...'
      # makes it into the bundle, the production runtime will fail.
      - name: Verify no unresolved path aliases in build output
        run: |
          if grep -RE "require\(['\"]@/" dist/; then
            echo "Found unresolved '@/' alias in compiled output — tsc-alias did not run."
            exit 1
          fi
          echo "OK — no unresolved aliases."

  # ─── Frontend ────────────────────────────────────────────────────────
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Confirm the production bundle is producible and dist/ has emitted assets.
      # Vite emits content-hashed JS/CSS — if dist/ is empty or has no index.html,
      # the build silently failed.
      - name: Verify dist artifacts emitted
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "OK — dist/index.html and dist/assets present."
