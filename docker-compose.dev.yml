# ---------------------------------------------------------------
# Infimit dev compose — Subphase 1 surface (backend + frontend).
#
# Brings up:
#   - mongo      (single-node, no auth — dev only)
#   - redis      (7+)
#   - minio      (S3-compatible object store; Subphase 3 media uploads)
#   - minio-init (one-shot: creates the dev bucket on first boot — idempotent)
#   - backend    (./backend/Dockerfile)
#   - frontend   (./frontend/Dockerfile — nginx serving the Vite build)
#
# Subphase 1 deliverable per Frontend_Handler_Documentation.md:
#   `docker compose -f docker-compose.dev.yml up` brings up all four services
#   and the SPA is reachable at http://localhost:5173.
#
# AI service is added in later subphases.
# ---------------------------------------------------------------

services:
  mongo:
    image: mongo:7
    container_name: infimit-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: infimit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # S3-compatible object store for Subphase 3 media uploads. Local dev only —
  # production uses real AWS S3. Console (web UI) at http://localhost:9001;
  # S3 API at http://localhost:9000. Credentials match .env.example defaults.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: infimit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bucket provisioner. Waits for minio to be healthy, creates the
  # infimit-dev bucket if absent, then exits 0. Re-running compose-up is safe.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: infimit-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/infimit-dev &&
        mc anonymous set download local/infimit-dev &&
        echo "minio bucket ready: infimit-dev"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infimit-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "4000"
      LOG_LEVEL: debug
      SERVICE_NAME: infimit-backend
      CORS_ORIGINS: "http://localhost:5173"
      MONGO_URI: "mongodb://mongo:27017/infimit"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "dev-access-secret-please-replace-32chars-min"
      JWT_REFRESH_SECRET: "dev-refresh-secret-please-replace-32chars-min"
      AI_SERVICE_URL: "http://ai-service:8000"
      AI_INTERNAL_KEY: "dev-internal-key"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Container talks to the backend via the docker network hostname,
        # but browsers loading the SPA call the host-mapped port on localhost.
        VITE_API_BASE_URL: "http://localhost:4000/v1"
    container_name: infimit-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
  redis_data:
  minio_data:
