# Infimit frontend — nginx config served by the Dockerfile runner stage.
#
# Key decisions:
#   - SPA fallback: any path that doesn't map to a static file is rewritten
#     to /index.html so React Router can resolve client-side routes (e.g.,
#     reloading at /article/foo doesn't 404).
#   - Long cache for hashed assets, short cache for everything else.
#   - Security headers applied at the server level (defense-in-depth — the
#     backend also sets these via helmet, but we layer here too).
#   - gzip on for text content; brotli would require nginx-mod and is left
#     for the production hardening pass.

server {
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Asset caching ──────────────────────────────────────────────────
    # Vite emits content-hashed filenames under /assets/, safe to immutable-cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static files — short cache, never SPA-fallback.
    location ~* \.(js|css|woff2|woff|ttf|svg|png|ico|webp|jpg|jpeg|gif)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # MSW service worker — never cache so updates roll out immediately.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ─── SPA fallback ───────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ─── Health endpoint (used by Docker HEALTHCHECK) ───────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ─── Security headers ───────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
}
